<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #0b1220; color: #e5e7eb; }
    .card { max-width: 520px; padding: 24px; border-radius: 12px; background: #0f172a; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; color: #93c5fd; }
    p { margin: 0 0 12px; line-height: 1.6; }
    .hint { color: #9ca3af; font-size: .95rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You’re offline</h1>
    <p>Some features may be unavailable. When connectivity returns, the app will sync again.</p>
    <p class="hint">Tip: Open the Courses section while online to cache content for later.</p>
  </main>
</body>
</html>
