<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - OASIS</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #0b1220; color: #e5e7eb; padding: 20px; }
    .card { max-width: 520px; padding: 32px; border-radius: 12px; background: #0f172a; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    h1 { margin: 0 0 16px; font-size: 2rem; color: #93c5fd; }
    p { margin: 0 0 20px; line-height: 1.6; color: #cbd5e1; }
    .hint { color: #9ca3af; font-size: .95rem; margin-bottom: 24px; }
    .nav-links { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .nav-links a { 
      display: block; 
      padding: 12px 20px; 
      background: #1e293b; 
      color: #93c5fd; 
      text-decoration: none; 
      border-radius: 8px; 
      transition: background 0.2s;
      text-align: center;
      font-weight: 500;
    }
    .nav-links a:hover { background: #334155; }
    .back-btn { 
      background: #3b82f6 !important; 
      color: white !important; 
    }
    .back-btn:hover { background: #2563eb !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📡 You're Offline</h1>
    <p>This page hasn't been cached yet. You can only access pages you've visited before.</p>
    <p class="hint">💡 Tip: Visit pages while online to cache them for offline viewing.</p>
    
    <div class="nav-links">
      <a href="javascript:history.back()" class="back-btn">← Go Back</a>
      <a href="/courses">View Courses</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/">Home</a>
    </div>
  </main>
</body>
</html>
